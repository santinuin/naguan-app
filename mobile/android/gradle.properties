# Memoria de la JVM de Gradle. La plantilla de Flutter trae -Xmx8G y 4G de
# metaspace: con el daemon de Kotlin aparte, el emulador y Docker abiertos, en
# una máquina de 14 GB el build de release terminaba matado por falta de
# memoria (exit 137). 4G alcanzan de sobra para esta app.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
