# Configuración de sqlc: genera código Go tipado a partir de las consultas SQL.
# Regenerar con `sqlc generate` desde backend/.
version: "2"
sql:
  - engine: postgresql
    # El esquema es el de las migraciones de Supabase: una sola fuente de verdad.
    schema: ../supabase/migrations
    queries: internal/db/queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        # Columnas nullable como punteros (*string, *int32) en vez de
        # pgtype.Text/pgtype.Int4: más simples de usar y de convertir a JSON.
        emit_pointers_for_null_types: true
        # Los structs de filas no se exponen como JSON: la API tiene sus
        # propios tipos (como separar entidad y DTO en Spring).
        emit_json_tags: false
