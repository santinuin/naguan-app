# Configuración de sqlc: genera código Go tipado a partir de las consultas SQL.
# Regenerar con `sqlc generate` desde backend/.
version: "2"
sql:
  - engine: postgresql
    # El esquema es el de las migraciones de Supabase: una sola fuente de verdad.
    schema: ../supabase/migrations
    queries: internal/db/queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        # Columnas nullable como punteros (*string, *int32) en vez de
        # pgtype.Text/pgtype.Int4: más simples de usar y de convertir a JSON.
        emit_pointers_for_null_types: true
        # Los structs de filas no se exponen como JSON: la API tiene sus
        # propios tipos (como separar entidad y DTO en Spring).
        emit_json_tags: false
        # Tipos de Postgres → tipos comunes de Go. Sin esto, sqlc usa los de
        # pgx (pgtype.UUID, pgtype.Timestamptz...), que son más incómodos.
        # Las columnas nullable necesitan su propio override (con puntero).
        overrides:
          - db_type: uuid
            go_type: string
          - db_type: uuid
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: date
            go_type: time.Time
          # numeric (kilos, MET) como float64: los pesos van de a 0,25 kg, que
          # float64 representa exacto, y salen a JSON como número. pgtype.Numeric
          # (decimal exacto) haría falta para plata, no para esto.
          - db_type: pg_catalog.numeric
            go_type: float64
          - db_type: pg_catalog.numeric
            nullable: true
            go_type:
              type: float64
              pointer: true
